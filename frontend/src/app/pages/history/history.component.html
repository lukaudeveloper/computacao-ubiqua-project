<div class="history">
    <h2>Measurement History</h2>

    <div class="filters">
        <button (click)="exportToCSV()">Export to CSV</button>
    </div>

    <app-measurement-chart [measurements]="measurements" [key]="chartKey"></app-measurement-chart>

    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Sensor</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let measurement of measurements">
                <td>{{ measurement.timestamp }}</td>
                <td>{{ measurement.sensor_name }}</td>
                <td>{{ measurement.value }}</td>
            </tr>
        </tbody>
    </table>
</div>
