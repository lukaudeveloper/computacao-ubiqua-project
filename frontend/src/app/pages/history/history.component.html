<div class="history">
    <h2>Measurement History</h2>

    <div class="filters">
        <button (click)="exportToCSV()">Export to CSV</button>
    </div>

    <app-measurement-chart [measurements]="allMeasurements" [key]="chartKey"></app-measurement-chart>

    <table>
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Sensor</th>
                <th>Value</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let measurement of measurements">
                <td>{{ measurement.timestamp }}</td>
                <td>{{ measurement.sensor_name }}</td>
                <td>{{ measurement.value }}</td>
            </tr>
        </tbody>
    </table>

    <div class="pagination" *ngIf="pagination.pages > 1">
        <button (click)="onPageChange(1)" [disabled]="currentPage === 1">First</button>
        <button (click)="onPageChange(currentPage - 1)" [disabled]="currentPage === 1">Previous</button>

        <span *ngFor="let page of visiblePages">
            <button (click)="onPageChange(page)" [class.active]="page === currentPage"
                [disabled]="page === currentPage">
                {{ page }}
            </button>
        </span>

        <button (click)="onPageChange(currentPage + 1)" [disabled]="currentPage === pagination.pages">Next</button>
        <button (click)="onPageChange(pagination.pages)" [disabled]="currentPage === pagination.pages">Last</button>

        <span class="pagination-info">
            Page {{ currentPage }} of {{ pagination.pages }} ({{ pagination.total }} total)
        </span>
    </div>
</div>
